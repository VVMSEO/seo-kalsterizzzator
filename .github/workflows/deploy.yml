name: Deploy to GitHub Pages

on:
  # Запускать деплой при пуше в ветку main (если у вас ветка master, измените на master)
  push:
    branches:
      - main
  # Позволяет запускать workflow вручную из вкладки Actions
  workflow_dispatch:

# Настройка прав доступа для GITHUB_TOKEN, необходимых для деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только один одновременный деплой
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Сборка проекта
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Папка, в которую Vite собирает проект
          path: ./dist

  # Деплой собранного проекта
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
